# Default configuration. Every key can be overridden with a BRIDGE_* environment
# variable; see docs/configuration.md for the full reference.
server:
  host: "0.0.0.0"
  port: 8080

storage:
  type: "memory"

otel:
  enabled: false
  endpoint: "localhost:4317"
  insecure: true
  serviceName: "cdevents-otel-bridge"

log:
  level: "info"
  format: "json"
