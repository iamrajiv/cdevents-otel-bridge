# Local development: in-memory storage, human-readable debug logs, tracing to a
# Jaeger or OTel Collector listening on localhost:4317.
server:
  host: "0.0.0.0"
  port: 8080

storage:
  type: "memory"

otel:
  enabled: false
  endpoint: "localhost:4317"
  insecure: true
  serviceName: "cdevents-otel-bridge"

log:
  level: "debug"
  format: "text"
