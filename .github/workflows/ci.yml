# Continuous integration. Runs on pushes and pull requests to main: format
# check, go vet, golangci-lint v2, build, unit and integration tests with
# the race detector, then builds all three container images without
# pushing and renders the Kubernetes manifests.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: go vet -tags=integration ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          args: --timeout=5m

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Integration tests
        run: go test -race -tags=integration ./test/integration/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bridge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build sample-app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/sample-app/Dockerfile
          push: false
          cache-from: type=gha

      - name: Build mock-deployer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/mock-deployer/Dockerfile
          push: false
          cache-from: type=gha

  manifests:
    name: Render Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: kubectl kustomize
        run: kubectl kustomize deployments/kubernetes > /dev/null
